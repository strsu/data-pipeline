[project]
name = "model-api"
version = "0.1.0"
description = "FastAPI model serving — PaddleOCR + YOLO + CLIP + CCIP"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "gunicorn>=23.0.0",
    "python-multipart>=0.0.9",
    "pillow>=11.0.0",
    "numpy>=2.0.0",
    "onnxruntime>=1.21.0",
    "paddlepaddle",
    "paddleocr>=3.5.0",
    "ultralytics>=8.3.0",
    "opencv-python-headless>=4.10.0",
    "transformers>=4.40.0",
    "accelerate>=0.30.0",
    "dghs-imgutils>=0.4.0",
]
requires-python = "==3.12.*"
