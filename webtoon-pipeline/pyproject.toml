[project]
name = "webtoon-pipeline"
version = "0.1.0"
description = "Webtoon analysis pipeline — Temporal durable-workflow worker"
dependencies = [
    "temporalio>=1.7.0",
    "psycopg2-binary==2.9.11",
    "boto3==1.38.21",
    "pillow==11.2.1",
    "numpy==2.2.6",
    "httpx>=0.27.0",
    "chromadb==1.5.9",
    "json-repair>=0.61.2",
    "celery[redis]>=5.4",
]
requires-python = "==3.12.*"

[dependency-groups]
dev = [
    "hypothesis>=6.155.7",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
